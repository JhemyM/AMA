name: AGRA Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build PWA
        run: npm run build:web
      - name: Archive PWA
        run: tar -czf agra-web.tar.gz -C dist/web .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agra-web
          path: agra-web.tar.gz

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Desktop Executable
        run: npm run desktop:win
      - name: Upload Exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agra-exe
          path: dist/desktop/*.exe

  publish:
    needs: [build-pwa, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: agra-web
          path: release-artifacts/
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: agra-exe
          path: release-artifacts/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*
