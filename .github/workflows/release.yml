name: AGRA Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build PWA
        run: npm run build:web
      - name: Install Android platform
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Archive PWA
        run: tar -czf agra-web-${{ github.ref_name }}.tar.gz -C dist/web .
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agra-web-${{ github.ref_name }}.tar.gz
            android-native/app/build/outputs/apk/debug/app-debug.apk
