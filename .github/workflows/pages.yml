name: Publish AGRA PWA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure private feedback recipient
        env:
          AGRA_FEEDBACK_EMAIL: ${{ secrets.AGRA_FEEDBACK_EMAIL }}
        run: |
          node -e "const fs=require('fs'); const email=process.env.AGRA_FEEDBACK_EMAIL || ''; fs.writeFileSync('feedback-config.js', 'window.AGRA_CONFIG = { feedbackEmail: ' + JSON.stringify(email) + ' };\n');"
      - name: Build web app
        run: npm run build:web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
