<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Limpando Cache do AGRA...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f1713; color: white; margin: 0; }
    .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: #4ad17c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px 0; }
    p { color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Limpando Cache...</h2>
  <p>Você será redirecionado em instantes.</p>

  <script>
    async function clearAll() {
      // 1. Unregister Service Workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
        }
      }
      
      // 2. Delete all caches
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const key of keys) {
          await caches.delete(key);
        }
      }
      
      // 3. Clear localStorage / sessionStorage (optional, but requested for full reset)
      localStorage.clear();
      sessionStorage.clear();
      
      // Redirect back to app
      setTimeout(() => {
        window.location.href = './';
      }, 1500);
    }
    
    clearAll().catch(e => {
      document.body.innerHTML = '<h2>Erro ao limpar cache</h2><p>' + e.message + '</p><a href="./" style="color:#4ad17c">Voltar</a>';
    });
  </script>
</body>
</html>
