<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3329">
  <title>AGRA | Login</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles-base.css?v=0.7.12">
  <link rel="stylesheet" href="styles.css?v=0.7.12">
</head>
<body>
  <!-- AUTHENTICATION SCREEN -->
  <div id="authContainer" class="auth-wrapper">
    <div class="auth-glass-panel">
      <div class="auth-header">
        <div class="auth-logo"><img src="icons/icon-192.png" alt="AGRA Logo"></div>
        <h1>Bem-vindo ao <strong>AGRA</strong></h1>
        <p>Gestão rural inteligente</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
          <div style="text-align: right; margin-top: 8px;">
            <button type="button" id="showRecoveryBtn" style="font-size: 12px; color: rgba(255,255,255,0.6); background: transparent; border: none; cursor: pointer; padding: 0;">Esqueceu a senha?</button>
          </div>
        </div>
        <div class="form-error" id="loginError" hidden>Credenciais inválidas.</div>
        <button type="submit" class="primary-button auth-btn">Entrar</button>
        <button type="button" class="secondary-button auth-btn" id="demoLoginBtn" style="margin-top: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);">Entrar como Demonstração (15 Minutos)</button>
        <button type="button" class="secondary-button auth-btn" onclick="window.location.href='clear_cache.html'" style="margin-top: 10px; background: rgba(255, 100, 100, 0.1); border: 1px solid rgba(255, 100, 100, 0.3); color: #ffbbbb;">Resolver Travamento (Limpar App)</button>
        <button type="button" class="text-button switch-auth" id="showRegisterBtn">Não tem conta? <span>Criar agora</span></button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form" hidden>
        <div class="form-group">
          <label for="regName">Nome Completo</label>
          <input type="text" id="regName" required placeholder="João da Silva" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" required placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" required placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="form-error" id="registerError" hidden>Este e-mail já está em uso.</div>
        <button type="submit" class="primary-button auth-btn">Criar Conta</button>
        <button type="button" class="text-button switch-auth" id="showLoginBtn">Já possui conta? <span>Fazer login</span></button>
      </form>

      <!-- RECOVERY FORM -->
      <form id="recoveryForm" class="auth-form" hidden>
        <p style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 24px; line-height: 1.5;">Digite seu e-mail abaixo. Enviaremos um link seguro para você redefinir sua senha.</p>
        <div class="form-group">
          <label for="recoveryEmail">E-mail de Recuperação</label>
          <input type="email" id="recoveryEmail" required placeholder="seu@email.com">
        </div>
        <div class="form-error" id="recoveryError" hidden>Erro.</div>
        <button type="submit" class="primary-button auth-btn">Enviar Link</button>
        <button type="button" class="text-button switch-auth" id="backToLoginBtn">Lembrou a senha? <span>Fazer login</span></button>
      </form>

      <!-- NEW PASSWORD FORM (shown when returning from email link) -->
      <form id="resetPasswordForm" class="auth-form" hidden>
        <p style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 24px; line-height: 1.5;">Autenticado com sucesso. Digite sua nova senha de acesso.</p>
        <div class="form-group">
          <label for="newPassword">Nova Senha</label>
          <input type="password" id="newPassword" required placeholder="••••••••">
        </div>
        <div class="form-error" id="resetError" hidden>Erro.</div>
        <button type="submit" class="primary-button auth-btn">Atualizar Senha</button>
      </form>
    </div>
  </div>
  
  <!-- Toasts -->
  <div class="toast" id="toast" role="status"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-client.js?v=0.7.12"></script>
  <script defer src="login.js?v=0.7.12"></script>
</body>
</html>
