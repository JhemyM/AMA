<div class="page-heading">
  <div>
    <p class="eyebrow">Conhecimento e Pesquisa</p>
    <h1>Manuais Embrapa</h1>
    <p class="muted">Acesse a biblioteca técnica oficial para auxiliar no manejo sustentável da sua propriedade.</p>
  </div>
  <div class="heading-actions" style="display:flex; gap: 0.5rem;">
    <input type="search" id="embrapaSearch" placeholder="Buscar manuais..." style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; width: 250px; background: var(--surface);">
    <button class="secondary-button" id="embrapaToggleSaved" type="button">⭐ Meus Salvos</button>
  </div>
</div>

<div class="embrapa-filters" id="embrapaFilters" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem;">
  <button class="secondary-button active" data-category="all" style="border-radius: 20px;">Todos</button>
  <button class="secondary-button" data-category="solo" style="border-radius: 20px;">Solo e Adubação</button>
  <button class="secondary-button" data-category="soja" style="border-radius: 20px;">Soja</button>
  <button class="secondary-button" data-category="milho" style="border-radius: 20px;">Milho</button>
  <button class="secondary-button" data-category="clima" style="border-radius: 20px;">Clima e Água</button>
</div>
<div class="embrapa-list" id="embrapaModuleList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
  <!-- Manuals will be dynamically injected here -->
</div>

<dialog class="feedback-dialog" id="manualDialog" aria-labelledby="manualTitle" style="padding: 2rem; border-radius: 12px; border: 1px solid var(--border); max-width: 600px;">
  <form method="dialog">
    <div class="dialog-heading" style="margin-bottom: 1.5rem;">
      <div>
        <h2 id="manualTitle" style="line-height: 1.3;">Título do Manual</h2>
      </div>
      <button class="dialog-close" value="cancel" type="button" onclick="document.getElementById('manualDialog').close()" aria-label="Fechar">×</button>
    </div>
    
    <div style="margin-bottom: 1.5rem;">
      <p class="muted" style="margin-bottom: 0.5rem;"><strong id="manualYear">2026</strong> · <span id="manualAuthors">Embrapa</span></p>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;" id="manualKeywords">
      </div>
      <p id="manualAbstract" style="line-height: 1.6;">Resumo do manual...</p>
    </div>
    
    <div class="feedback-actions" style="display:flex; justify-content:flex-end; gap: 1rem; align-items:center;">
      <button class="secondary-button" id="manualSaveBtn" type="button" style="margin-right:auto;">⭐ Salvar</button>
      <button class="secondary-button" value="cancel" type="button" onclick="document.getElementById('manualDialog').close()">Fechar</button>
      <button class="primary-button" id="manualDownloadBtn" type="button">Baixar PDF <span>⬇</span></button>
    </div>
  </form>
</dialog>
