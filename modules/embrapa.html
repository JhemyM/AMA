<div class="page-heading">
  <div>
    <p class="eyebrow">Conhecimento e Pesquisa</p>
    <h1>Manuais Embrapa</h1>
    <p class="muted">Acesse a biblioteca técnica oficial para auxiliar no manejo sustentável da sua propriedade.</p>
  </div>
  <div class="heading-actions" style="display:flex; gap: 0.5rem;">
    <input type="search" id="embrapaSearch" placeholder="Buscar manuais..." style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; width: 250px; background: var(--surface);">
    <button class="secondary-button" id="embrapaToggleSaved" type="button">⭐ Meus Salvos</button>
    <button class="secondary-button" id="embrapaPrefsBtn" type="button" title="Configurar interesses e escala">⚙️ Preferências</button>
  </div>
</div>

<div class="embrapa-filters" id="embrapaFilters" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem;">
  <button class="secondary-button active" data-category="all" style="border-radius: 20px;">Todos</button>
  <button class="secondary-button" data-category="recommended" style="border-radius: 20px; border-color: var(--primary); color: var(--primary);">🎯 Recomendados (On-Demand)</button>
  <button class="secondary-button" data-category="solo" style="border-radius: 20px;">Solo e Adubação</button>
  <button class="secondary-button" data-category="soja" style="border-radius: 20px;">Soja e Milho</button>
  <button class="secondary-button" data-category="gado" style="border-radius: 20px;">Pecuária e Criação</button>
  <button class="secondary-button" data-category="clima" style="border-radius: 20px;">Clima e Água</button>
</div>
<div class="embrapa-list" id="embrapaModuleList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
  <!-- Manuals will be dynamically injected here -->
</div>

<dialog class="feedback-dialog" id="manualDialog" aria-labelledby="manualTitle" style="padding: 2rem; border-radius: 12px; border: 1px solid var(--border); max-width: 600px;">
  <form method="dialog">
    <div class="dialog-heading" style="margin-bottom: 1.5rem;">
      <div>
        <h2 id="manualTitle" style="line-height: 1.3;">Título do Manual</h2>
      </div>
      <button class="dialog-close" value="cancel" type="button" onclick="document.getElementById('manualDialog').close()" aria-label="Fechar">×</button>
    </div>
    
    <div style="margin-bottom: 1.5rem; max-height: 50vh; overflow-y: auto; padding-right: 0.5rem;">
      <p class="muted" style="margin-bottom: 0.5rem;"><strong id="manualYear">2026</strong> · <span id="manualAuthors">Embrapa</span></p>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;" id="manualKeywords">
      </div>
      <p id="manualAbstract" style="line-height: 1.6; font-weight: 500; margin-bottom: 1rem;">Resumo do manual...</p>
      <div id="manualFullText" style="line-height: 1.8; color: var(--text-muted); display: none; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;"></div>
    </div>
    
    <div class="feedback-actions" style="display:flex; justify-content:flex-end; gap: 1rem; align-items:center;">
      <button class="secondary-button" id="manualSaveBtn" type="button" style="margin-right:auto;">⭐ Salvar</button>
      <button class="secondary-button" value="cancel" type="button" onclick="document.getElementById('manualDialog').close()">Fechar</button>
      <button class="primary-button" id="manualReadBtn" type="button">Ler Artigo Completo <span>📖</span></button>
    </div>
  </form>
</dialog>

<dialog class="feedback-dialog" id="embrapaPrefsDialog" style="padding: 2rem; border-radius: 12px; border: 1px solid var(--border); max-width: 400px; width: 100%;">
  <form id="embrapaPrefsForm" method="dialog">
    <div class="dialog-heading" style="margin-bottom: 1.5rem;">
      <h2 style="line-height: 1.3;">Limites e Escala (On-Demand)</h2>
    </div>
    
    <div style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
      <label>
        <span class="muted" style="display:block; margin-bottom: 0.25rem;">Escala de Produção</span>
        <select id="prefScale" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
          <option value="todas">Qualquer Escala</option>
          <option value="pequena">Pequena (Agricultura Familiar)</option>
          <option value="media">Média (Tecnificada)</option>
          <option value="grande">Grande (Agricultura de Precisão)</option>
        </select>
      </label>
      
      <label>
        <span class="muted" style="display:block; margin-bottom: 0.25rem;">Clima Predominante</span>
        <select id="prefClimate" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
          <option value="todos">Todos</option>
          <option value="cerrado">Cerrado / Seco</option>
          <option value="sul">Temperado / Sul</option>
          <option value="semiarido">Semiárido</option>
        </select>
      </label>
    </div>
    
    <div class="feedback-actions" style="display:flex; justify-content:flex-end; gap: 1rem;">
      <button class="secondary-button" type="button" onclick="document.getElementById('embrapaPrefsDialog').close()">Cancelar</button>
      <button class="primary-button" type="submit">Aplicar Filtros Inteligentes</button>
    </div>
  </form>
</dialog>
